[project]
name = "grademind-api"
version = "0.1.0"
description = "FastAPI service: auth/RBAC, uploads, jobs + SSE, health. No pipeline runs inside a request."
requires-python = ">=3.12,<3.13"
dependencies = [
    "grademind-core",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "sse-starlette==3.5.0",
    "email-validator==2.3.0",
    "redis==6.4.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grademind_api"]
