[project]
name = "grademind-worker"
version = "0.1.0"
description = "Celery worker: idempotent, resumable pipeline stages."
requires-python = ">=3.12,<3.13"
dependencies = [
    "grademind-core",
    "celery[redis]==5.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grademind_worker"]
