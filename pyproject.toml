[project]
name = "grademind-workspace"
version = "0.0.0"
description = "GradeMIND v2 monorepo root (uv workspace). Spike tooling under spike/ is NOT part of the workspace."
requires-python = ">=3.12,<3.13"
dependencies = ["grademind-core", "grademind-api", "grademind-worker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker"]

[tool.uv.sources]
grademind-core = { workspace = true }
grademind-api = { workspace = true }
grademind-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "httpx2==2.13.1",  # starlette TestClient uses the maintained httpx fork
    "ruff==0.16.10",
    "mypy==2.4.0",
    "import-linter==2.15",
    "hypothesis==6.168.5",
    "pytest-cov==7.1.0",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["spike", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented dependency-injection idiom (evaluated per request by FastAPI, not at definition time)
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "grademind_api.deps.require_roles"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]  # autogenerated by alembic
"**/tests/*.py" = ["S106", "S603", "S608"]
"scripts/*.py" = ["S310"]  # operator scripts open URLs of the local stack only  # fake hashes, fixed subprocess args, fixed table names

[tool.pytest.ini_options]
testpaths = ["tests", "packages/core/tests", "apps/api/tests", "apps/worker/tests", "services/ocr/tests"]
# the OCR service is not a workspace member (its Paddle wheels come from Paddle's own index); its Paddle-free modules are
# tested here, the engine itself in its container
pythonpath = ["services/ocr/src", "tests/helpers"]
asyncio_mode = "auto"
filterwarnings = [
    # worker_world is imported by the test modules before pytest loads it as a plugin; it has no asserts to rewrite
    "ignore:Module already imported so cannot be rewritten; worker_world",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]
mypy_path = "services/ocr/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "pypdfium2", "pypdfium2.*"]  # no type information; each confined to one thin module
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["paddle", "paddle.*", "paddleocr", "paddleocr.*", "cv2", "numpy"]  # only in the OCR container, not the workspace venv
ignore_missing_imports = true

# --- import-linter (spec rule 3 and rule 7: one path to every external system; run by scripts/check_single_paths.sh) ---
[tool.importlinter]
root_packages = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: core is the base; api and worker never import each other"
type = "layers"
layers = ["grademind_api | grademind_worker", "grademind_core"]

[[tool.importlinter.contracts]]
name = "Apps never import the OCR service package (they talk to it over HTTP)"
type = "forbidden"
source_modules = ["grademind_core", "grademind_api", "grademind_worker"]
forbidden_modules = ["grademind_ocr"]

[[tool.importlinter.contracts]]
name = "Object storage SDK only in the single storage module"
type = "forbidden"
source_modules = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]
forbidden_modules = ["minio", "boto3", "botocore"]
ignore_imports = ["grademind_core.storage -> minio"]

[[tool.importlinter.contracts]]
name = "Task queue SDK only in the producer and consumer adapters"
type = "forbidden"
source_modules = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]
forbidden_modules = ["celery"]
ignore_imports = ["grademind_api.queue -> celery", "grademind_worker.celery_app -> celery"]

[[tool.importlinter.contracts]]
name = "OCR engine SDKs only in the OCR adapter (rule 7)"
type = "forbidden"
source_modules = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]
forbidden_modules = ["paddle", "paddleocr", "paddlex", "cv2", "transformers", "torch"]
ignore_imports = ["grademind_ocr.engine -> paddle", "grademind_ocr.engine -> paddleocr", "grademind_ocr.engine -> cv2"]

[[tool.importlinter.contracts]]
name = "No LLM SDK in the v1 product path (D19: AI suggestions disabled; the gateway arrives with its adapter)"
type = "forbidden"
source_modules = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]
forbidden_modules = ["anthropic", "openai", "google", "vllm", "litellm"]

[[tool.importlinter.contracts]]
name = "PDF / image libraries only in grademind_core.pdf (the OCR service has its own engine adapter)"
type = "forbidden"
source_modules = ["grademind_core", "grademind_api", "grademind_worker"]
forbidden_modules = ["pypdfium2", "PIL", "fitz", "pdfplumber"]
ignore_imports = ["grademind_core.pdf -> pypdfium2", "grademind_core.pdf -> PIL"]

# D28: machine-read text is display-only. Nothing that computes or records marks may import anything OCR-related, directly or
# through any chain of imports (import-linter checks indirect imports by default). The OCR tables live in db/ocr_models.py and
# the OCR API in routes/ocr.py precisely so this contract can say something.
[[tool.importlinter.contracts]]
name = "OCR text never reaches a verdict (D28)"
type = "forbidden"
source_modules = [
    "grademind_core.scoring",
    "grademind_core.grading",
    "grademind_core.evaluation",
    "grademind_api.routes.grading",
    "grademind_api.routes.grading_docs",
]
forbidden_modules = [
    "grademind_core.db.ocr_models",
    "grademind_core.ocr_client",
    "grademind_core.ocr_runs",
    "grademind_core.ocr_geometry",
    "grademind_core.line_corrections",
    "grademind_core.dataset_export",
    "grademind_api.routes.ocr",
    "grademind_worker.ocr_stage",
]
