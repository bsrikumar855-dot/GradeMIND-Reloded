[project]
name = "grademind-workspace"
version = "0.0.0"
description = "GradeMIND v2 monorepo root (uv workspace). Spike tooling under spike/ is NOT part of the workspace."
requires-python = ">=3.12,<3.13"
dependencies = ["grademind-core", "grademind-api", "grademind-worker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker"]

[tool.uv.sources]
grademind-core = { workspace = true }
grademind-api = { workspace = true }
grademind-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "httpx2==2.13.1",  # starlette TestClient uses the maintained httpx fork
    "ruff==0.16.10",
    "mypy==2.4.0",
    "import-linter==2.15",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["spike", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented dependency-injection idiom (evaluated per request by FastAPI, not at definition time)
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "grademind_api.deps.require_roles"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]  # autogenerated by alembic
"**/tests/*.py" = ["S106", "S603", "S608"]
"scripts/*.py" = ["S310"]  # operator scripts open URLs of the local stack only  # fake hashes, fixed subprocess args, fixed table names

[tool.pytest.ini_options]
testpaths = ["tests", "packages/core/tests", "apps/api/tests", "apps/worker/tests", "services/ocr/tests"]
# the OCR service is not a workspace member (its Paddle wheels come from Paddle's own index); its Paddle-free modules are
# tested here, the engine itself in its container
pythonpath = ["services/ocr/src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["grademind_core", "grademind_api", "grademind_worker", "grademind_ocr"]
mypy_path = "services/ocr/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]  # celery ships no type information; its use is confined to two thin modules
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["paddle", "paddle.*", "paddleocr", "paddleocr.*", "cv2", "numpy"]  # only in the OCR container, not the workspace venv
ignore_missing_imports = true
