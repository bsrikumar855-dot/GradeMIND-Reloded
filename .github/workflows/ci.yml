name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: gm
          POSTGRES_PASSWORD: gm
          POSTGRES_DB: gm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GRADEMIND_TEST_DATABASE_URL: postgresql+psycopg://gm:gm@localhost:5432/gm_test
      # throwaway credentials for a throwaway CI container; not secrets
      GRADEMIND_TEST_S3_ENDPOINT: http://127.0.0.1:59000
      GRADEMIND_TEST_S3_ACCESS_KEY: gmtest
      GRADEMIND_TEST_S3_SECRET_KEY: gmtest-secret-123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          lfs: false   # tests need only text/JSON fixtures, not page images
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Python 3.12
        run: uv python install 3.12
      - name: MinIO (a step, not a service, because the image needs the `server /data` argument)
        run: |
          docker run -d --name minio -p 127.0.0.1:59000:9000 \
            -e MINIO_ROOT_USER=$GRADEMIND_TEST_S3_ACCESS_KEY -e MINIO_ROOT_PASSWORD=$GRADEMIND_TEST_S3_SECRET_KEY \
            cgr.dev/chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18 server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:59000/minio/health/live && exit 0; sleep 1; done; docker logs minio; exit 1
      - name: age (pinned, checksum-verified; the backup encryption tests run it)
        run: ./scripts/fetch_age.sh
      - name: make test (rule 13; DB invariant tests run against the Postgres service)
        run: make test
      - name: lint (ruff, mypy strict, import-linter + shadow-path scanner)
        run: make lint
      - name: alembic models == migrations
        working-directory: packages/core
        run: GRADEMIND_DATABASE_URL=$GRADEMIND_TEST_DATABASE_URL uv run --frozen alembic -c alembic.ini check

      - name: "dependency audit (a REPORT in this log, not a gate; read it when it changes, see docs/SECURITY_AUDIT.md)"
        continue-on-error: true
        run: |
          uv export --frozen --no-hashes --all-packages --no-emit-workspace -o "$RUNNER_TEMP/req.txt" > /dev/null
          echo "== Python workspace =="; uvx pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip --progress-spinner off
          echo "== OCR service =="; uvx pip-audit -r services/ocr/requirements.lock.txt --no-deps --disable-pip --progress-spinner off
          echo "== web =="; cd apps/web && npx --yes pnpm@12.10.1 audit

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # scan the whole history: the repo is public
          lfs: false
      - name: gitleaks v8.30.1 (checksum-verified binary) over the full git history
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          lfs: false
      - name: web image (tsc --noEmit, eslint --max-warnings 0, next build)
        run: docker build -t grademind-web:ci apps/web

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          lfs: false
      - name: throwaway .env for this run
        run: |
          gen() { python3 -c "import secrets; print(secrets.token_urlsafe($1))"; }
          {
            echo "GRADEMIND_JWT_SECRET=$(gen 48)"
            echo "POSTGRES_PASSWORD=$(gen 24)"
            echo "MINIO_ROOT_USER=grademind"
            echo "MINIO_ROOT_PASSWORD=$(gen 24)"
            echo "GRADEMIND_ADMIN_ORG=CI College"
            echo "GRADEMIND_ADMIN_EMAIL=admin@example.edu"
            echo "GRADEMIND_ADMIN_PASSWORD=$(gen 18)"
            echo "GRADEMIND_S3_PUBLIC_ENDPOINT_URL=http://localhost:9000"
          } > .env
      - name: cache the vendored OCR dependencies (keyed by their pinned sha256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: services/ocr/vendor-cache
          key: ocr-vendor-${{ hashFiles('services/ocr/vendor.sha256') }}
      - name: vendored OCR wheels + weights (release assets, sha256-verified; no Paddle CDN / Hugging Face)
        run: ./scripts/fetch_ocr_vendor.sh
      - name: build and start the stack (the OCR image build runs the rule-12 assertion)
        run: docker compose up -d --build
      - name: wait for health
        run: ./scripts/compose_wait.sh 1200
      - name: end-to-end smoke
        run: python3 scripts/compose_smoke.py
      - name: examiner account for the E2E (created with the CLI; the password is masked and never logged)
        run: |
          set -euo pipefail
          ORG="$(grep '^GRADEMIND_ADMIN_ORG=' .env | cut -d= -f2-)"
          EXPW="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$EXPW"
          docker compose exec -T -e GRADEMIND_USER_PASSWORD="$EXPW" api \
            python -m grademind_core.cli create-user --org "$ORG" --email examiner@example.edu --role examiner --name Examiner
          echo "E2E_EXAMINER_EMAIL=examiner@example.edu" >> "$GITHUB_ENV"
          echo "E2E_EXAMINER_PASSWORD=$EXPW" >> "$GITHUB_ENV"
      - name: browser E2E (Playwright against the live stack; uses the runner's Google Chrome)
        working-directory: apps/web
        run: |
          set -euo pipefail
          python3 -c "import sys; sys.path.insert(0, '../../tests/helpers'); from pdfgen import make_pdf; open('e2e/fixtures/booklet.pdf', 'wb').write(make_pdf([['E2E booklet page 1'], ['page 2']]))"
          python3 -c "import sys; sys.path.insert(0, '../../tests/helpers'); from pdfgen import make_pdf; open('e2e/fixtures/phase3-booklet.pdf', 'wb').write(make_pdf([['Photosynthesis needs light and water.', 'Plants make their own food in the leaves.', 'Chlorophyll gives leaves their green colour.'], ['page two']]))"
          node --version
          npm install --global pnpm@12.10.1
          pnpm install --frozen-lockfile
          # .env is not shell syntax (GRADEMIND_ADMIN_ORG has a space), so read just the two values
          E2E_EMAIL="$(grep '^GRADEMIND_ADMIN_EMAIL=' ../../.env | cut -d= -f2-)"
          E2E_PASSWORD="$(grep '^GRADEMIND_ADMIN_PASSWORD=' ../../.env | cut -d= -f2-)"
          export E2E_EMAIL E2E_PASSWORD
          pnpm exec playwright test
      - name: Phase 3 evidence from the real database (corrections, audit trail, append-only triggers)
        run: ./scripts/phase3_evidence.sh "docker compose exec -T postgres psql -U grademind -d grademind"
      - name: "Phase 4 evidence from the real database (finalize and reopen history, snapshots, audit, the database's own refusals)"
        run: ./scripts/phase4_evidence.sh "docker compose exec -T postgres psql -U grademind -d grademind"
      - name: verify every finalized result by recomputing it from the raw records (I12; fails loudly on any difference)
        run: |
          set -euo pipefail
          docker compose exec -T api python -m grademind_core.cli verify-snapshots | tee verify.out
          grep -q '^VERIFY OK: [1-9][0-9]* snapshot' verify.out   # at least one snapshot was checked, not an empty run
      - name: "backup and restore drill (4.6; back up the live stack, restore a side copy and verify it, then restore over the live data)"
        run: |
          set -euo pipefail
          ./scripts/backup.sh backups/ci
          ./scripts/restore.sh backups/ci restore_drill gm-restore-drill | tee restore.out
          grep -q '^RESTORE VERIFY OK' restore.out
          # disaster recovery: nothing holds the database open, it is dropped and rebuilt from the backup
          docker compose stop api worker ocr-worker web
          ./scripts/restore.sh backups/ci grademind grademind --replace-live | tee restore-live.out
          grep -q '^RESTORE VERIFY OK' restore-live.out
          # the OCR service may still be reading pages after the browser tests; wait until it answers before starting what depends on it
          for i in $(seq 1 60); do [ "$(docker compose ps --format '{{.Health}}' ocr)" = healthy ] && break; sleep 5; done
          docker compose start api worker ocr-worker web
          ./scripts/compose_wait.sh 600
          docker compose exec -T api python -m grademind_core.cli verify-snapshots | tee after.out
          grep -q '^VERIFY OK: [1-9][0-9]* snapshot' after.out   # the finalized results survived the restore, and still recompute
          python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from compose_smoke import call, check, env
          import json
          code, tok = call('POST', '/api/auth/login', json.dumps({'email': env('GRADEMIND_ADMIN_EMAIL'), 'password': env('GRADEMIND_ADMIN_PASSWORD')}).encode(), {'content-type': 'application/json'})
          check(code == 200, 'the administrator can sign in to the restored system')
          code, exams = call('GET', '/api/exams', headers={'authorization': 'Bearer ' + tok['access_token']})
          check(code == 200 and len(exams) > 0, f'the restored system lists its exams ({len(exams)})')
          "
      - name: "encrypted backup drill (5.2; weekly copy encrypted to a throwaway public key, shipped off, restored with the private key, a wrong key refused)"
        run: |
          set -euo pipefail
          ./scripts/fetch_age.sh
          tools/age/age-keygen -o "$RUNNER_TEMP/owner.key" 2> "$RUNNER_TEMP/keygen.out"
          grep -o 'age1[a-z0-9]*' "$RUNNER_TEMP/keygen.out" | head -1 > "$RUNNER_TEMP/recipients.txt"   # the PUBLIC key only
          tools/age/age-keygen -o "$RUNNER_TEMP/wrong.key" 2> /dev/null
          export GRADEMIND_BACKUP_DIR=backups/rot GRADEMIND_BACKUP_RECIPIENTS="$RUNNER_TEMP/recipients.txt" GRADEMIND_OFFSITE_DIR="$RUNNER_TEMP/offsite"
          ./scripts/backup_rotate.sh --weekly
          ENC="$(ls backups/rot/weekly/*.tar.age)"
          ls -1 backups/rot/daily | grep -E '^[0-9]{8}T[0-9]{6}Z$'                      # the nightly local backup exists
          cmp "$ENC" "$GRADEMIND_OFFSITE_DIR/$(basename "$ENC")"                         # the off-machine copy is the same file
          (cd "$GRADEMIND_OFFSITE_DIR" && sha256sum -c --quiet "$(basename "$ENC").sha256")
          head -c 21 "$ENC" | grep -q '^age-encryption.org/v1'
          if grep -aq -e 'PGDMP' -e 'GradeMIND backup' "$ENC"; then echo "plaintext found inside the encrypted copy"; exit 1; fi
          if ./scripts/restore.sh "$ENC" drill_wrongkey gm-drill-wrongkey --identity "$RUNNER_TEMP/wrong.key"; then echo "a WRONG key restored the backup"; exit 1; fi
          test -z "$(docker compose exec -T postgres psql -U grademind -d postgres -Atc "select 1 from pg_database where datname = 'drill_wrongkey'" | tr -d '\r')"   # nothing was created
          ./scripts/restore.sh "$ENC" restore_enc gm-restore-enc --identity "$RUNNER_TEMP/owner.key" | tee enc.out
          grep -q '^RESTORE VERIFY OK' enc.out
          # the private key is nowhere in the stack's environment or in the repository
          if docker compose exec -T api env | grep -q 'AGE-SECRET-KEY-1'; then echo "private key in the api environment"; exit 1; fi
          if git grep -qE 'AGE-SECRET-KEY-1[A-Z0-9]{20,}'; then echo "private key in the repository"; exit 1; fi
      - name: OCR killed and restarted in the middle of a booklet (4.0; retried by itself, no page read twice, grading never blocked)
        run: python3 scripts/ocr_chaos.py
      - name: "https profile (5.3; reverse proxy with a local CA, secure cookie, HSTS and CSP, only the proxy publishes a port, images over HTTPS)"
        run: |
          set -euo pipefail
          export GRADEMIND_HOST=localhost GRADEMIND_COOKIE_SECURE=true GRADEMIND_S3_PUBLIC_ENDPOINT_URL=https://localhost:9443
          docker compose -f compose.yaml -f compose.https.yaml --profile https up -d --no-build
          ./scripts/compose_wait.sh 900
          docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/ca.crt"
          # the certificate chain is verified against the proxy's own root (not skipped)
          curl -fsS --cacert "$RUNNER_TEMP/ca.crt" -D hdr.txt -o /dev/null https://localhost:8443/login
          cat hdr.txt
          grep -qi '^strict-transport-security: max-age=' hdr.txt
          grep -qi "^content-security-policy:.*nonce-" hdr.txt
          if grep -qi '^server:' hdr.txt; then echo "the proxy announces itself"; exit 1; fi
          curl -fsS --cacert "$RUNNER_TEMP/ca.crt" https://localhost:9443/minio/health/live
          # without that root the certificate is NOT trusted (it is a local CA, not a public one)
          if curl -fsS --max-time 10 https://localhost:8443/login > /dev/null 2>&1; then echo "the local CA is trusted by default: unexpected"; exit 1; fi
          # nothing else is published: the plain ports are closed
          for p in 3100 8000 9000; do if curl -sS --max-time 3 "http://127.0.0.1:$p/" > /dev/null 2>&1; then echo "port $p is still open"; exit 1; fi; done
          docker ps --format '{{.Names}} {{.Ports}}' | grep -E '(0\.0\.0\.0|127\.0\.0\.1|\[::\]):[0-9]+->' | tee published.txt
          test "$(cut -d' ' -f1 published.txt | sort -u)" = "grademind-proxy-1"
          cd apps/web
          E2E_EMAIL="$(grep '^GRADEMIND_ADMIN_EMAIL=' ../../.env | cut -d= -f2-)"
          E2E_PASSWORD="$(grep '^GRADEMIND_ADMIN_PASSWORD=' ../../.env | cut -d= -f2-)"
          export E2E_EMAIL E2E_PASSWORD E2E_HTTPS=1 E2E_IGNORE_HTTPS_ERRORS=1 E2E_WEB=https://localhost:8443
          pnpm exec playwright test e2e/https.spec.ts
      - name: logs on failure
        if: failure()
        run: |
          docker compose ps -a
          echo "== jobs and their stage attempts (what failed, and why) =="
          docker compose exec -T postgres psql -U grademind -d grademind -c "select j.kind, j.status, j.current_stage, left(coalesce(j.error,''),160) as error, j.created_at from processing_jobs j order by j.created_at" || true
          docker compose exec -T postgres psql -U grademind -d grademind -c "select a.stage, a.attempt_no, a.status, left(coalesce(a.error,''),160) as error from job_stage_attempts a order by a.seq" || true
          echo "== OCR runs =="
          docker compose exec -T postgres psql -U grademind -d grademind -c "select status, left(coalesce(error,''),120) as error, count(*) from ocr_runs group by 1,2" || true
          docker compose logs --no-color --tail=200
