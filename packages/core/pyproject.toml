[project]
name = "grademind-core"
version = "0.1.0"
description = "Shared core: single config source, provider registry, DB models, storage, security."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "minio==7.2.20",
    "httpx==0.28.1",
    "pypdfium2==5.14.0",
    "pillow==12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grademind_core"]
