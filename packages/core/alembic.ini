[alembic]
script_location = %(here)s/src/grademind_core/db/migrations
# URL comes from GRADEMIND_DATABASE_URL via env.py (single config source); never hard-coded here.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
